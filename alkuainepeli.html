const elements=raw.split(';').map(s=>{let [sym,name,z,row,col,group]=s.split(',');return{sym,name,z:+z,row:+row,col:+col,group}});const $=s=>document.querySelector(s);let tab='learn',direction='symname',pool=[],index=0,answers=[],locked=false,score=0,sound=true;const groupNames={nonmetal:'Epämetalli',noble:'Jalokaasu',alkali:'Alkalimetalli',alkaline:'Maa-alkalimetalli',metalloid:'Puolimetalli',halogen:'Halogeeni',transition:'Siirtymämetalli',post:'Metalli',lanthanide:'Lantanidi',actinide:'Aktinidi',unknown:'Metalli / luokitus vaihtelee'};function beep(ok){if(!sound)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=ok?660:230;gain.gain.setValueAtTime(.06,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.17);osc.start();osc.stop(ctx.currentTime+.18);osc.onended=()=>ctx.close()}catch(e){}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function norm(s){return String(s).trim().toLocaleLowerCase('fi').replace(/\s+/g,' ')}function buildTable(){const root=$('#table');elements.forEach(e=>{let b=document.createElement('button');b.className='element '+e.group;b.style.gridRow=e.row;b.style.gridColumn=e.col;b.innerHTML=`<span class="num">${e.z}</span><b>${e.sym}</b><small>${e.name}</small><img class="tilephoto" alt="" loading="lazy" hidden>`;b.dataset.symbol=e.sym;b.onclick=()=>openDetail(e);root.append(b)})}const photos=new Map();
async function loadPhotos(){
 // Sivujen esikatselukuvat näytetään suoraan korteissa, ilman Wikipediaan siirtymistä.
 for(let i=0;i<elements.length;i+=25){
  const batch=elements.slice(i,i+25);
  try{
   const api='https://fi.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=220&titles='+encodeURIComponent(batch.map(e=>e.name).join('|'));

   const pages=Object.values(d.query?.pages||{});
   for(const e of batch){const page=pages.find(p=>norm(p.title)===norm(e.name));if(page?.thumbnail?.source){photos.set(e.z,page.thumbnail.source);const tile=document.querySelector(`[data-symbol="${e.sym}"] .tilephoto`);if(tile){tile.src=page.thumbnail.source;tile.hidden=false;tile.onerror=()=>tile.hidden=true}}}
  }catch(err){}
 }

 const src=photos.get(e.z);const im=$('#detailimage');im.style.display=src?'block':'none';if(src)im.src=src;

}
function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#learn').classList.toggle('hidden',t!=='learn');$('#fillarea').classList.toggle('hidden',t!=='write');$('#activity').classList.toggle('hidden',t==='learn'||t==='write');const names={learn:'Jaksollinen järjestelmä',write:'Täytä taulukko',exam:'Muistokoe',game:'Pikapeli'};$('#heading').textContent=names[t];$('#description').textContent=t==='learn'?'Tutki alkuaineita. Avaa kortti nähdäksesi lisätiedot ja esimerkkikuvan.':t==='write'?'Täytä taulukon tyhjät ruudut. Tarkista kaikki vastaukset lopuksi.':t==='exam'?'Täytä sekä alkuaineen nimi että kemiallinen merkki ilman vihjeitä.': 'Valitse oikea kortti mahdollisimman nopeasti!';$('#modecontrols').innerHTML=t==='learn'?'':`<label for="count">Alkuaineita</label><select id="count"><option value="10">10 ensimmäistä</option><option value="20" selected>20 ensimmäistä</option><option value="40">40 ensimmäistä</option><option value="118">Kaikki 118</option></select>${t==='exam'?'':`<label for="direction">Suunta</label><select id="direction"><option value="symname">Merkki → nimi</option><option value="namesym">Nimi → merkki</option></select>`}`;$('#modecontrols').querySelectorAll('select').forEach(x=>x.onchange=t==='write'?startFill:start);if(t==='write')startFill();else if(t!=='learn')start()}function start(){let n=Number($('#count')?.value||20);direction=$('#direction')?.value||'symname';pool=shuffle(elements.filter(e=>e.z<=n));index=0;answers=[];score=0;locked=false;$('#feedback').innerHTML='';render()}function render(){if(index>=pool.length){finish();return}locked=false;let e=pool[index];$('#progress').textContent=`${index+1} / ${pool.length} · Oikein: ${score}`;$('#feedback').innerHTML='';$('#next').classList.add('hidden');$('#submit').classList.toggle('hidden',tab==='game');$('#question').textContent=tab==='exam'?`Alkuaine numero ${e.z}`:direction==='symname'?e.sym:e.name;const box=$('#response');box.innerHTML='';if(tab==='game'){let opts=shuffle([e,...shuffle(elements.filter(x=>x!==e&&x.z<=Number($('#count').value))).slice(0,3)]);let grid=document.createElement('div');grid.className='choices';opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="side">'+(direction==='symname'?x.name:x.sym)+'</span><span class="back">'+(direction==='symname'?x.sym:x.name)+'</span>';b.onclick=()=>{if(locked)return;locked=true;let ok=x===e;answers.push({e,ok});if(ok)score++;beep(ok);b.classList.add(ok?'correct':'wrong');[...grid.children][opts.indexOf(e)]?.classList.add('correct');grid.querySelectorAll('button').forEach(btn=>btn.classList.add('revealed'));$('#feedback').textContent=ok?'✓ Oikein!':`✗ Oikea vastaus: ${direction==='symname'?e.name:e.sym}`;$('#next').classList.remove('hidden');$('#progress').textContent=`${index+1} / ${pool.length} · Oikein: ${score}`};grid.append(b)});box.append(grid)}else{if(tab==='exam'){box.innerHTML='<input class="answer" id="nameanswer" placeholder="Alkuaineen nimi" autocomplete="off"> <input class="answer" id="symanswer" placeholder="Kemiallinen merkki" autocomplete="off">'}else{box.innerHTML='<input class="answer" id="oneanswer" placeholder="Kirjoita vastaus" autocomplete="off">'}box.querySelector('input')?.focus()}}function check(){if(locked)return;let e=pool[index],ok;if(tab==='exam'){ok=norm($('#nameanswer').value)===norm(e.name)&&norm($('#symanswer').value)===norm(e.sym)}else{ok=norm($('#oneanswer').value)===norm(direction==='symname'?e.name:e.sym)}locked=true;answers.push({e,ok});if(ok)score++;beep(ok);$('#feedback').innerHTML=`<div class="result">${ok?'✓ Oikein!':'✗ Ei aivan.'} Oikea vastaus: <strong>${e.sym} — ${e.name}</strong></div>`;$('#next').classList.remove('hidden');$('#progress').textContent=`${index+1} / ${pool.length} · Oikein: ${score}`}function finish(){if(tab!=='game'&&!locked&&index<pool.length){/* unfinished current question is counted as unanswered */}let total=pool.length,percent=Math.round(score/total*100),missed=answers.filter(a=>!a.ok).map(a=>a.e).concat(pool.slice(index+(locked?1:0)));$('#question').textContent='Tason tulokset 🎉';$('#response').innerHTML=`<div class="result"><h2>${score} / ${total} oikein (${percent} %)</h2><p>${percent===100?'Täydellinen suoritus!':percent>=80?'Hienoa työtä!':'Harjoittelu tekee mestarin!'}</p><p>${missed.length?'Kertaa nämä: '+missed.slice(0,35).map(e=>e.sym+' – '+e.name).join(', ')+(missed.length>35?'…':''):'Kaikki oikein!'}</p></div>`;$('#feedback').innerHTML='';$('#submit').classList.add('hidden');$('#next').classList.add('hidden');$('#progress').textContent='Valmis';}
let fillInputs=[];
function startFill(){
 const n=Number($('#count')?.value||20),dir=$('#direction')?.value||'symname',root=$('#filltable');root.innerHTML='';$('#fillresult').innerHTML='';fillInputs=[];
 elements.forEach(e=>{const cell=document.createElement('div');cell.className='fillcell '+e.group;cell.style.gridRow=e.row;cell.style.gridColumn=e.col;const active=e.z<=n;const hint=dir==='symname'?e.sym:e.name;cell.innerHTML='<span class="num">'+e.z+'</span><div class="hint '+(hint.length>9?'long':'')+'">'+(active?hint:e.sym)+'</div>';if(active){const inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder=dir==='symname'?'Nimi':'Merkki';inp.setAttribute('aria-label',e.z+'. '+hint+' — '+(dir==='symname'?'nimi':'merkki'));inp.addEventListener('input',()=>{cell.classList.remove('good','bad');updateFillProgress()});inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();let i=fillInputs.findIndex(x=>x.inp===inp);fillInputs[(i+1)%fillInputs.length]?.inp.focus()}});cell.append(inp);fillInputs.push({e,inp,cell,dir})}else{cell.style.opacity='.35';cell.style.pointerEvents='none'}root.append(cell)});updateFillProgress();
}
function updateFillProgress(){const count=fillInputs.filter(x=>x.inp.value.trim()).length;$('#fillprogress').textContent='⚡ '+count+' / '+fillInputs.length+' täytetty';}
function checkFill(){let correct=0,answered=0;fillInputs.forEach(({e,inp,cell,dir})=>{const expected=dir==='symname'?e.name:e.sym,ok=norm(inp.value)===norm(expected);if(inp.value.trim())answered++;if(ok)correct++;cell.classList.toggle('good',ok);cell.classList.toggle('bad',!ok);cell.querySelector('.correctlabel')?.remove();if(!ok){let d=document.createElement('div');d.className='correctlabel';d.textContent=expected;cell.append(d)} });let pct=Math.round(correct/fillInputs.length*100);$('#fillresult').innerHTML='<div class="result"><strong>🏆 '+correct+' / '+fillInputs.length+' oikein — '+pct+' %</strong><p>'+ (pct===100?'Täydellistä! 🌟':pct>=80?'Mahtavaa! 🔥':'Yritä uudelleen ja paranna tulosta! 💪')+'</p><button id="retrywrong">Harjoittele virheitä ↻</button></div>';$('#retrywrong').onclick=()=>{fillInputs.forEach(x=>{if(x.cell.classList.contains('bad')){x.inp.value='';x.cell.classList.remove('bad');x.cell.querySelector('.correctlabel')?.remove()} });$('#fillresult').innerHTML='';updateFillProgress();fillInputs.find(x=>!x.inp.value.trim())?.inp.focus()};beep(pct>=70)}
$('#fillcheck').onclick=checkFill;$('#fillreset').onclick=startFill;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#submit').onclick=check;$('#next').onclick=()=>{index++;render()};$('#finish').onclick=finish;$('#restart').onclick=start;$('#close').onclick=()=>$('#detail').close();$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Äänet päällä':'🔇 Äänet pois'};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&tab!=='learn'&&tab!=='game'){if(locked){index++;render()}else check()}});buildTable();loadPhotos();</script></body></html>
