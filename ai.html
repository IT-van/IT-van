<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAi</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #5b8cff;
    --text: #e8e9ec;
    --muted: #8a8f9a;
    --bubble-user: #2a3550;
    --bubble-bot: #1f232c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 90vh;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 12px;
    color: var(--accent);
  }
  #chat {
    flex: 1;
    background: var(--panel);
    border-radius: 14px;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2e38;
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <h1>AI personal asistent</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Напиши сообщение..." autocomplete="off" />
    <button id="send" type="submit">send</button>
  </form>
</div>

<script>
  // === НАСТРОЙКИ: поменяй под себя ===
  const PROXY_URL = "http://localhost:5000.trycloudflare.com/chat";
  const API_KEY = "мой-секретный-ключ-12345"; // тот же, что в server.py

  const chatEl = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  addMessage("system", "hi its my AI assistent get stardet from my home PC");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;
    addMessage("system", "texting...");

    try {
      const res = await fetch(PROXY_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY,
        },
        body: JSON.stringify({ messages: history }),
      });

      chatEl.removeChild(chatEl.lastChild); // убираем "Печатает..."

      if (!res.ok) {
        addMessage("system", "wrong: the server is invalid (" + res.status + ")");
      } else {
        const data = await res.json();
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      chatEl.removeChild(chatEl.lastChild);
      addMessage("system", "cant meeting with server. it is online?");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
